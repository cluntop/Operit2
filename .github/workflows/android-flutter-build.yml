name: Android Flutter Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build-android-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android runtime build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison build-essential bzip2 ca-certificates curl diffutils flex gawk \
            gzip patch pkg-config tar unzip xz-utils \
            python3 qemu-user-static
  
      - name: Fetch Android runtime sources
        shell: pwsh
        run: pwsh -NoProfile -File tools/android-runtime/fetch_sources.ps1

      - name: Fetch Android NDK
        run: bash tools/android-runtime/fetch_ndk_wsl.sh

      - name: Build Android terminal runtime
        run: |
          export ANDROID_NDK_HOME="$HOME/.cache/operit-android-runtime/android-ndk-r29-beta4"
          bash tools/android-runtime/build_android_tools_wsl.sh
          bash tools/android-runtime/build_alpine_rootfs_wsl.sh
          
      - name: Verify packaged Node 24 and SQLite
        env:
          RUNTIME_ARCHIVE: apps/flutter/app/android/app/src/main/assets/android-runtime/arm64-v8a/rootfs.tar.gz.bin
          RUNTIME_ARCHITECTURE: aarch64
          RUNTIME_PACKAGE_LAYOUT: preinstalled
        run: |
          bash tools/runtime/smoke_alpine_node24.sh \
            "$RUNTIME_ARCHIVE" "$RUNTIME_ARCHITECTURE" "$RUNTIME_PACKAGE_LAYOUT" \
            | tee node24-smoke.log

      - name: Upload Node 24 smoke log
        uses: actions/upload-artifact@v4
        with:
          name: node24-smoke-${{ github.sha }}
          path: node24-smoke.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload Android terminal runtime
        uses: actions/upload-artifact@v4
        with:
          name: operit2-android-runtime-${{ github.sha }}
          path: |
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/libbash.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_busybox.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_loader.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_proot.so
            apps/flutter/app/android/app/src/main/assets/android-runtime/arm64-v8a/rootfs.tar.gz.bin
            apps/flutter/app/android/app/src/main/assets/android-runtime/arm64-v8a/rootfs.tar.gz.bin.sha256
          if-no-files-found: error
          retention-days: 1

  build-android-v8:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      LIBCLANG_PATH: /usr/lib/llvm-21/lib
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install V8 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            python3 python3-venv python3-pip \
            curl git pkg-config libssl-dev unzip \
            software-properties-common wget gnupg

      - name: Install LLVM 21 via llvm.sh
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y libclang-21-dev llvm-21-dev
          # 验证
          llvm-config-21 --version
          ls /usr/lib/llvm-21/lib/libclang.so* || echo "WARNING: libclang.so not found"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: aarch64-linux-android

      - name: Fetch Android NDK
        run: bash tools/android-runtime/fetch_ndk_wsl.sh

      - name: Create Python venv
        run: |
          python3 -m venv .venv
          .venv/bin/python --version

      - name: Diagnose LLVM and LIBCLANG_PATH
        run: |
          echo "=== LIBCLANG_PATH: $LIBCLANG_PATH ==="
          echo "=== which clang-21 ==="
          which clang-21 || echo "clang-21 not found"
          echo "=== /usr/lib/llvm-21/lib contents ==="
          ls -la /usr/lib/llvm-21/lib/libclang.so* 2>/dev/null || echo "libclang.so not found in /usr/lib/llvm-21/lib"
          echo "=== llvm-config-21 version ==="
          llvm-config-21 --version 2>/dev/null || echo "llvm-config-21 not found"

      - name: Build V8 for aarch64-linux-android
        env:
          ANDROID_NDK_HOME: ${{ github.workspace }}/.cache/operit-android-runtime/android-ndk-r29-beta4
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          mkdir -p apps/flutter/native/operit-flutter-bridge/target/operit-v8
          .venv/bin/python tools/build_scripts/prepare_android_v8.py \
            --target aarch64-linux-android \
            --env-file apps/flutter/native/operit-flutter-bridge/target/operit-v8/aarch64-linux-android.v8.env

      - name: Verify LLVM 21 installation
        run: |
          clang-21 --version
          llvm-config-21 --version
          ls /usr/lib/llvm-21/lib/libclang.so* || true

      - name: Collect V8 artifacts
        run: |
          mkdir -p v8-artifacts
          # 1. V8 编译产物目录
          SRC="tools/release/work/android-v8/152.2.0/build/aarch64-linux-android/release"
          if [ -d "$SRC" ]; then
            cp -r "$SRC"/. v8-artifacts/
          else
            echo "WARN: $SRC not found, dumping work dir:"
            find tools/release/work/android-v8 -maxdepth 5 -type d 2>/dev/null || true
            exit 1
          fi
          # 2. env 文件（Gradle 期望的位置）
          ENV_FILE="apps/flutter/native/operit-flutter-bridge/target/operit-v8/aarch64-linux-android.v8.env"
          if [ -f "$ENV_FILE" ]; then
            cp "$ENV_FILE" v8-artifacts/
            echo "=== env file ==="
            cat "$ENV_FILE"
          else
            echo "ERROR: env file not generated at $ENV_FILE"
            exit 1
          fi
          echo "=== collected ==="
          ls -la v8-artifacts/

      - name: Upload prebuilt V8
        uses: actions/upload-artifact@v4
        with:
          name: android-v8-prebuilt-${{ github.sha }}
          path: v8-artifacts/
          if-no-files-found: error
          retention-days: 14

  build-android:

    needs: [build-android-runtime, build-android-v8]
    runs-on: windows-2025
    timeout-minutes: 90

    env:
      RUSTFLAGS: -Awarnings
      RUST_TOOLCHAIN_VERSION: 1.95.0
      FVM_VERSION: 4.3.0
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      OPERIT_V8_PREBUILT: "1"   # ← 告诉 Gradle 跳过 V8 编译

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download Android terminal runtime
        uses: actions/download-artifact@v4
        with:
          name: operit2-android-runtime-${{ github.sha }}
          path: apps/flutter/app/android/app/src/main

      - name: Download prebuilt Android V8
        uses: actions/download-artifact@v4
        with:
          name: android-v8-prebuilt-${{ github.sha }}
          path: tools/release/work/android-v8/152.2.0/build/aarch64-linux-android/release

      - name: Locate prebuilt V8 archive and binding
        id: v8
        shell: pwsh
        run: |
          $releaseDir = "tools/release/work/android-v8/152.2.0/build/aarch64-linux-android/release"
          $archive = Get-ChildItem -Path $releaseDir -Recurse -Filter "*.a" |
            Where-Object { $_.Name -match 'rusty_v8|libv8' } |
            Select-Object -First 1
          $binding = Get-ChildItem -Path $releaseDir -Recurse -Filter "*.rs" |
            Where-Object { $_.Name -match 'src_binding' } |
            Select-Object -First 1
          if (-not $archive) { throw "No V8 archive (.a) found under $releaseDir" }
          if (-not $binding) { throw "No V8 binding (.rs) found under $releaseDir" }
          Write-Host "ARCHIVE: $($archive.FullName)"
          Write-Host "BINDING: $($binding.FullName)"
          "archive=$($archive.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "binding=$($binding.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Download prebuilt Android V8
        uses: actions/download-artifact@v4
        with:
          name: android-v8-prebuilt-${{ github.sha }}
          path: tools/release/work/android-v8/152.2.0/build/aarch64-linux-android/release

      - name: Place V8 env file where Gradle expects
        shell: pwsh
        run: |
          $releaseDir = "tools/release/work/android-v8/152.2.0/build/aarch64-linux-android/release"
          $srcEnv = Join-Path $releaseDir "aarch64-linux-android.v8.env"
          if (-not (Test-Path $srcEnv)) { throw "V8 env file not found: $srcEnv" }

          # 找实际的 .a 和 .rs
          $archive = Get-ChildItem -Path $releaseDir -Recurse -Filter "*.a" |
            Where-Object { $_.Name -match 'rusty_v8|libv8' } |
            Select-Object -First 1
          $binding = Get-ChildItem -Path $releaseDir -Recurse -Filter "*.rs" |
            Where-Object { $_.Name -match 'src_binding' } |
            Select-Object -First 1
          if (-not $archive) { throw "No .a under $releaseDir" }
          if (-not $binding) { throw "No src_binding .rs under $releaseDir" }

          $dst = "apps/flutter/native/operit-flutter-bridge/target/operit-v8/aarch64-linux-android.v8.env"
          New-Item -ItemType Directory -Force -Path (Split-Path $dst) | Out-Null
          @(
            "export RUSTY_V8_ARCHIVE=$($archive.FullName)",
            "export RUSTY_V8_SRC_BINDING_PATH=$($binding.FullName)"
          ) | Set-Content -Path $dst -Encoding utf8
          Write-Host "=== V8 env ==="
          Get-Content $dst

      - name: Install bootstrap Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Debug - inspect repo layout
        shell: pwsh
        run: |
          Write-Host "=== GITHUB_WORKSPACE ==="
          Write-Host $env:GITHUB_WORKSPACE
          Write-Host "`n=== .ci-tools exists? ==="
          Test-Path .ci-tools
          Write-Host "`n=== .ci-tools content ==="
          if (Test-Path .ci-tools) { Get-ChildItem -Recurse .ci-tools | Select-Object FullName }
          Write-Host "`n=== package.json locations ==="
          Get-ChildItem -Recurse -Filter "package.json" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\node_modules\\' } |
            Select-Object -ExpandProperty FullName
          Write-Host "`n=== tsc on PATH? ==="
          Get-Command tsc -ErrorAction SilentlyContinue
          Write-Host "`n=== grep ci-tools in scripts ==="
          Get-ChildItem -Recurse -Include *.py,*.ps1,*.sh -ErrorAction SilentlyContinue |
            Select-String -Pattern "ci-tools" -List |
            Select-Object Path, LineNumber, Line

      - name: Install Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install FVM
        shell: pwsh
        run: |
          dart pub global activate fvm $env:FVM_VERSION
          "$env:APPDATA\Pub\Cache\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Add node_modules/.bin to PATH
        shell: pwsh
        run: |
          $nodeBin = Join-Path $env:GITHUB_WORKSPACE "node_modules\.bin"
          $nodeBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Add venv to PATH
        shell: pwsh
        run: echo "$env:GITHUB_WORKSPACE\.venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install project Flutter SDK
        working-directory: apps/flutter/app
        shell: pwsh
        run: fvm install --skip-pub-get

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: aarch64-linux-android

      - name: Prepare TypeScript toolchain
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE;$env:GITHUB_WORKSPACE\tools\build_scripts"
          python -c "from tools.build_scripts.common import ensure_typescript; ensure_typescript('5.8.3')"
          $tsc = ".ci-tools\typescript\node_modules\.bin\tsc.cmd"
          if (-not (Test-Path $tsc)) { throw "tsc not found at $tsc" }
          & $tsc --version

      - name: Enable pnpm via corepack
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm --version

      - name: Install pnpm dependencies
        shell: pwsh
        run: |
          $locks = Get-ChildItem -Recurse -Filter "pnpm-lock.yaml" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\node_modules\\' }
          if (-not $locks) { throw "No pnpm-lock.yaml found" }
          foreach ($lock in $locks) {
            $dir = $lock.DirectoryName
            Write-Host "=== pnpm install in $dir ==="
            Push-Location $dir
            try {
              pnpm install --no-frozen-lockfile
              if ($LASTEXITCODE -ne 0) { throw "pnpm install failed in $dir" }
            } finally {
              Pop-Location
            }
          }

      - name: Set Ninja env var for V8 build
        shell: pwsh
        run: |
          $ninjaExe = "C:\ninja\ninja.exe"
          "NINJA=$ninjaExe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prepare Android bindgen libclang
        shell: pwsh
        run: |
          $version = "21.1.8"
          $packageName = "libclang.runtime.win-x64.$version"
          $toolsDir = "target/operit-build-tools"
          $packageDir = Join-Path $toolsDir $packageName
          $archive = Join-Path $toolsDir "$packageName.nupkg"
          New-Item -ItemType Directory -Force -Path $toolsDir | Out-Null
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/libclang.runtime.win-x64/$version" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $packageDir -Force
          $libclang = Join-Path $packageDir "runtimes/win-x64/native/libclang.dll"
          if (-not (Test-Path -LiteralPath $libclang)) {
            throw "Android bindgen libclang was not prepared at $libclang"
          }

      - name: Restore Android signing material
        shell: pwsh
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          $required = @(
            "ANDROID_RELEASE_KEYSTORE_BASE64",
            "ANDROID_RELEASE_STORE_PASSWORD",
            "ANDROID_RELEASE_KEY_ALIAS",
            "ANDROID_RELEASE_KEY_PASSWORD"
          )
          $missing = $required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing.Count -gt 0) {
            throw "Missing required GitHub Actions secrets: $($missing -join ', ')"
          }
          $secretsDir = "tools/release/secrets"
          New-Item -ItemType Directory -Force -Path $secretsDir | Out-Null
          $keystore = Join-Path $secretsDir "operit2-release.keystore"
          [System.IO.File]::WriteAllBytes($keystore, [System.Convert]::FromBase64String($env:ANDROID_RELEASE_KEYSTORE_BASE64))
          @"
          RELEASE_STORE_FILE=operit2-release.keystore
          RELEASE_STORE_PASSWORD=$env:ANDROID_RELEASE_STORE_PASSWORD
          RELEASE_KEY_ALIAS=$env:ANDROID_RELEASE_KEY_ALIAS
          RELEASE_KEY_PASSWORD=$env:ANDROID_RELEASE_KEY_PASSWORD
          "@ | Set-Content -Path (Join-Path $secretsDir "android-signing.properties") -Encoding utf8

      - name: Check build environment
        shell: pwsh
        run: python tools/build_scripts/check_build_environment.py --products app --github-runner

      - name: Create virtual environment
        shell: pwsh
        run: |
          python -m venv .venv
          if (-not (Test-Path ".venv\Scripts\python.exe")) {
            throw "venv python was not created"
          }
          .venv\Scripts\python.exe --version

      - name: Install Python dependencies
        shell: pwsh
        run: |
          $req = "plugins/tools/requirements.txt"
          if (Test-Path $req) {
            .venv\Scripts\pip install -r $req
          } else {
            Write-Host "No $req found, skipping Python deps."
          }
      
      - name: Show gradle invocation of prepare_android_v8
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Include *.gradle,*.gradle.kts -ErrorAction SilentlyContinue |
            Select-String -Pattern "prepare_android_v8|prepareAndroidV8" -Context 5,5 |
            ForEach-Object {
              Write-Host "=== $($_.Path):$($_.LineNumber) ==="
              $_.Context.PreContext
              $_.Line
              $_.Context.PostContext
            }

      - name: Find Aliyun mirror declarations
        shell: pwsh
        run: |
          $exclude = @('\\\.fvm\\','\\\.gradle\\','\\build\\','\\\.dart_tool\\','\\node_modules\\')
          Get-ChildItem -Path . -Recurse -File -Include *.gradle,*.gradle.kts -ErrorAction SilentlyContinue |
            Where-Object { $p = $_.FullName; -not ($exclude | Where-Object { $p -match $_ }) } |
            Select-String -Pattern "maven\.aliyun\.com" -Context 2,2 |
            ForEach-Object {
              Write-Host "=== $($_.Path):$($_.LineNumber) ==="
              $_.Context.PreContext
              $_.Line
              $_.Context.PostContext
            }

      - name: Strip Aliyun Maven mirrors in CI
        shell: pwsh
        run: |
          # 只扫项目自己的 gradle 文件，排除 Flutter SDK、构建产物、依赖缓存
          $exclude = @(
            '\\\.fvm\\',
            '\\\.gradle\\',
            '\\build\\',
            '\\\.dart_tool\\',
            '\\node_modules\\'
          )
          $files = Get-ChildItem -Path . -Recurse -File -Include *.gradle,*.gradle.kts -ErrorAction SilentlyContinue |
            Where-Object {
              $p = $_.FullName
              -not ($exclude | Where-Object { $p -match $_ })
            }
      
          if (-not $files) { throw "No gradle files found after filtering" }
      
          $patched = 0
          foreach ($f in $files) {
            $raw = Get-Content $f.FullName -Raw
            if ($raw -notmatch 'maven\.aliyun\.com') { continue }
            Write-Host "Patching: $($f.FullName)"
            $new = $raw -replace '(?m)^[ \t]*maven[ \t]*\{[ \t]*(url[ \t]*=[ \t]*uri|setUrl)[ \t]*\([ \t]*"https://maven\.aliyun\.com[^"]*"[ \t]*\)[ \t]*\}[ \t]*\r?\n', ''
            if ($new -ne $raw) {
              Set-Content -Path $f.FullName -Value $new -Encoding utf8 -NoNewline
              $patched++
            }
          }
          if ($patched -eq 0) {
            throw "No Aliyun mirror lines were patched. Check settings.gradle.kts manually."
          }
          Write-Host "Patched $patched file(s)"

      - name: Find Aliyun mirror declarations
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Recurse -Include *.gradle,*.gradle.kts -ErrorAction SilentlyContinue |
            Select-String -Pattern "maven\.aliyun\.com" -Context 2,2 |
            ForEach-Object {
              Write-Host "=== $($_.Path):$($_.LineNumber) ==="
              $_.Context.PreContext
              $_.Line
              $_.Context.PostContext
            }

      - name: Build and package Android app
        shell: pwsh
        run: |
          $version = (Select-String -Path apps/flutter/app/pubspec.yaml -Pattern '^version:\s*(\d+\.\d+\.\d+)\+(\d+)\s*$').Matches
          if ($version.Count -ne 1) {
            throw "apps/flutter/app/pubspec.yaml must contain exactly one release version line"
          }
          python tools/build_scripts/build_flutter_android.py --build-name $version[0].Groups[1].Value --build-number $version[0].Groups[2].Value --enforce-lockfile

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: operit2-android-${{ github.sha }}
          path: tools/release/dist/operit2-app-android-arm64-v8a-*.apk
          if-no-files-found: error
          retention-days: 14
